apiVersion : apps/v1
kind: Deployment
metadata:
  name: bhupendrashkargocd 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bhupendrashkargocd
  template:
    metadata:
      labels:
        app: bhupendrashkargocd 
    spec:
      containers:
        - name: bhupendrashkargocd 
          image: anishka.azurecr.io/bhupendrashkargocd
          ports:
          - containerPort: 80